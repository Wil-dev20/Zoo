const blank=()=>({users:[],current:null,opinions:[],reports:[],sessions:{}});let db=JSON.parse(localStorage.getItem('zv-db')||'null')||blank();const cloudClient=(window.supabase&&window.ZV_CONFIG&&ZV_CONFIG.supabaseUrl&&ZV_CONFIG.publishableKey)?window.supabase.createClient(ZV_CONFIG.supabaseUrl,ZV_CONFIG.publishableKey):null;let cloudWrite=Promise.resolve();let page='home',selected=null,quizIndex=0,quizCorrect=0,quizAnswered=false,stars=0,flash='';function save(){if(db.current==='__guest__')return;localStorage.setItem('zv-db',JSON.stringify(db))}function user(){return db.current==='__guest__'?db.guest:db.users.find(x=>x.email===db.current)}function stats(){let u=user();return u?.stats||{points:0,visits:[],correct:0,answered:0,completed:0}}function startGuest(){db.guest={first:'Invitado',last:'',email:'',phone:'',stats:{points:0,visits:[],correct:0,answered:0,completed:0}};db.current='__guest__';page='rules';render()}function acceptRules(){page='home';render()}function acceptRulesIfChecked(){if(document.getElementById('rulesok').checked)acceptRules();else alert('Acepta las normas para continuar.')}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,action,cls=''){return `<button type="button" class="btn ${cls}" onclick="${action}">${label}</button>`}function go(p){page=p;render()}function nav(){return `<nav class="tabs">${[['home','⌂','Inicio'],['animals','🐾','Animales'],['games','🎮','Juegos'],['points','★','Puntos'],['profile','●','Perfil']].map(([id,ic,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${n}</button>`).join('')}</nav>`}function shell(content){return `<div class="app"><header class="top"><div class="brand"><span class="paw">🐾</span> Zoológico Vivo</div><small>Explora, aprende y cuida · Cerrito de la Libertad</small></header><main class="layout">${content}<div class="footer">Prototipo educativo · Los datos de animales son ejemplos function render(){if(!db.current)return renderAuth();let u=user();document.getElementById('app').innerHTML=shell(pageContent(u));}function renderAuth(){document.getElementById('app').innerHTML=`<header class="top"><div class="brand"><span class="paw">🐾</span> Zoológico Vivo</div><small>Explora, aprende y cuida</small></header><main class="layout"><section class="hero"><div><p class="tag">BIENESTAR ANIMAL · APRENDE · PARTICIPA</p><h1>Una aventura<br>para aprender.</h1><p>Explora el zoológico, descubre animales y guarda tu progreso.</p></div><div class="heroart">🦁</div></section><section class="panel form"><h2>${page==='signup'?'Crear cuenta':'¡Bienvenido!'}</h2><p class="muted">${page==='signup'?'Crea tu perfil para guardar puntos y recorridos.':'Inicia sesión para continuar tu recorrido.'}</p><form onsubmit="auth(event,'${page==='signup'?'signup':'login'}')">${page==='signup'?`<div class="field"><label>Nombres</label><input name="first" required></div><div class="field"><label>Apellidos</label><input name="last" required></div><div class="field"><label>Celular</label><input name="phone" type="tel" required></div><div class="field"><label>Procedencia</label><select name="origin" required><option value="">Selecciona…</option><option>Huancayo</option><option>Otra provincia de Junín</option><option>Otra región del Perú</option><option>Extranjero</option></select></div><div class="field"><label>Distrito o país (opcional)</label><input name="location_detail"></div><div class="field"><label>Rango de edad (opcional)</label><select name="age_range"><option value="">Prefiero no indicar</option><option>Niño</option><option>Adolescente</option><option>Adulto</option><option>Adulto mayor</option></select></div><div class="field"><label>¿Cómo te enteraste? (opcional)</label><select name="referral_source"><option value="">Selecciona…</option><option>Redes sociales</option><option>Familiares o amigos</option><option>Colegio</option><option>Paso por la zona</option><option>Otro</opt derAuth()}finally{const current=document.querySelector('.form [type="submit"]');if(current){current.disabled=false;current.textContent=page==='signup'?'Crear cuenta':'Iniciar sesión'}}}function pageContent(u){let s=stats();if(page==='rules')return `<h1>Antes de empezar, cuidemos a los animales</h1><section class="panel"><div class="grid"><article class="card"><h3>🚫 No alimentar</h3><p>Los animales reciben una dieta preparada por su equipo cuidador.</p></article><article class="card"><h3>🐾 No molestar</h3><p>No golpees ni te acerques a los recintos.</p></article><article class="card"><h3>🤫 Evita ruidos fuertes</h3><p>Habla bajo y ayuda a mantener un ambiente tranquilo.</p></article><article class="card"><h3>♻️ Cuida el entorno</h3><p>Deposita la basura en los tachos.</p></article></div><label><input type="checkbox" id="rulesok"> Me comprometo a cumplir las normas</label><p>${btn('Entendido, ¡empezar!',"acceptRulesIfChecked()")}</p></section>`;if(page==='home')return `<section class="hero"><div><p class="tag">¡HOLA, ${esc(u.first.toUpperCase())}!</p><h1>Tu aventura<br>comienza aquí.</h1><p>Explora, aprende sobre los animales y suma puntos en cada visita.</p><div class="row">${btn('🗺️ Comenzar recorrido',"go('animals')")} ${btn('🐾 Ver animales',"go('animals')",'light')}</div></div><div class="heroart">🦁</div></section><div class="grid"><div class="card"><div class="score">${s.points} ★</div><span class="muted">Puntos acumulados</span></div><div class="card"><div class="score">${s.visits.length}</div><span class="muted">Animales visitados</span></div><div class="card"><div class="score">${s.correct}</div><span class="muted">Respuestas correctas</span></div></div><div class="sectionhead"><h2>¿Qué te gustaría hacer?</h2></div><div class="grid"><div class="card"><h3>🦒 Descubre animales</h3><p class="muted">Conoce especies y datos educativos.</p>${btn('Explorar',"go('animals')",'light')}</div><div class="card"><h3>🎮 Pon a prueba lo que sabes</h3><p class="muted">Responde pr return `<h1>Recorrido completado</h1><section class="hero"><div><p class="tag">¡EXPERIENCIA TERMINADA!</p><h1>${s.points} puntos</h1><p>Animales visitados: ${s.visits.length} · Preguntas: ${s.answered} · Correctas: ${s.correct}</p>${btn('Calificar experiencia',"go('opinion')")} ${btn('Volver al inicio',"go('home')",'light')}</div><div class="heroart">🏁</div></section>`}
function selectAnimal(id){selected=animals.find(a=>a.id===id);if(selected){go('route')}else{render()}}function quizQuestions(a){return [{q:a.q,opts:a.opts,ans:a.ans,fact:a.fact},{q:'¿Qué alimentación corresponde a este animal?',opts:[a.food,'Solo frutas cítricas','Solo pescado'],ans:0,fact:'Su alimentación general es '+a.food+'.'},{q:'¿Cuál es su hábitat general?',opts:[a.habitat,'Arrecife de coral','Hielo polar'],ans:0,fact:'Esta especie habita en '+a.habitat+'.'}]}let quizWasCorrect=false,quizDuplicate=false;function startQuiz(){quizIndex=0;quizCorrect=0;quizAnswered=false;go('quiz')}async function answer(i){if(quizAnswered)return;let a=selected||animals[0],q=quizQuestions(a)[quizIndex],st=stats();quizWasCorrect=i===q.ans;quizDuplicate=false;if(cloudClient&&db.cloudUserId){let an=await cloudClient.from('animales').select('id').eq('slug',a.id).single();if(an.error){flash='No se encontró el animal en la base de datos.';return render()}let qu=await cloudClient.from('preguntas').select('id').eq('animal_id',an.data.id).eq('question_order',quizIndex+1).single();if(qu.error){flash='No se encontró la pregunta en la base de datos.';return render()}let result=await cloudClient.rpc('zv_submit_answer',{p_question_id:qu.data.id,p_option:String.fromCharCode(65+i)});if(result.error){flash='No se pudo guardar la respuesta.';return render()}quizWasCorrect=result.data.is_correct;quizDuplicate=result.data.already_answered}quizAnswered=true;if(!quizDuplicate){st.answered++;if(quizWasCorrect){quizCorrect++;st.correct++;st.points++}}save();render()}function nextQuestion(){if(quizIndex>=2){finishQuiz();return}quizIndex++;quizAnswered=false;render()}async function finishQuiz(){let st=stats(),a=selected||animals[0];if(!st.visits.includes(a.id)){let added=true;if(cloudClient&&db.cloudUserId){let an=await cloudClient.from('animales').select('id').eq('slug',a.id).single();if(an.error){flash='No se pudo registrar la visita.';return render()}let v=await cloudClient.rpc('zv_record_visit',{p_animal_id:an.data.id});if(v.error){flash='No se pudo guardar la visita.';return render()}added=v.data===true}st.visits.push(a.id);if(added)st.points++}save();go('quizresult')}async function completeTour(){let st=stats();st.completed++;if(cloudClient&&db.cloudUserId){let r=await cloudClient.rpc('zv_finish_tour');if(r.error){flash='No se pudo sincronizar el cierre del recorrido.'}}save();go('final')}function editProfile(e){e.preventDefault();Object.assign(user(),Object.fromEntries(new FormData(e.target)));save();go('profile')}async function sendOpinion(){if(!stars){flash='Elige una calificación de 1 a 5 estrellas.';return render()}let comment=document.getElementById('optext').value;if(cloudClient&&db.cloudUserId){let r=await cloudClient.from('opiniones').insert({visitor_id:db.cloudUserId,rating:stars,comment});if(r.error){flash='No se pudo guardar la opinión en línea.';return render()}}db.opinions.push({email:db.current,stars,text:comment,date:new Date().toISOString()});save();flash='¡Gracias! Tu opinión quedó guardada.';render()}async function sendReport(){let file=document.getElementById('rphoto').files[0],photo='';if(file)photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});let category=document.getElementById('rtype').value,place=document.getElementById('rplace').value,description=document.getElementById('rdesc').value;if(cloudClient&&db.cloudUserId){let r=await cloudClient.from('reportes').insert({visitor_id:db.cloudUserId,category,animal_location:place,description});if(r.error){flash='No se pudo guardar el reporte en línea.';return render()}}db.reports.push({email:db.current,type:category,place,text:description,photo,date:new Date().toISOString(),status:'Nuevo'});save();flash='Reporte guardado.';render()}async function logout(){if(cloudClient)await cloudClient.auth.signOut();if(db.current==='__guest__')db.guest=null;db.current=null;db.cloudUserId=null;save();page='login';render()}function deleteAccount(){if(confirm('¿Eliminar la cuenta y sus datos guardados en este dispositivo?')){db.users=db.users.filter(x=>x.email!==db.current);db.current=null;save();page='login';render()}}
if(cloudClient){renderAuth();cloudClient.auth.getSession().then(async({data})=>{const ru=data.session?.user;if(!ru)return;db.current=ru.email;db.cloudUserId=ru.id;const meta=ru.user_metadata||{},display=meta.display_name||meta.full_name||meta.name||ru.email.split('@')[0],first=meta.first||meta.given_name||display.split(' ')[0],last=meta.last||meta.family_name||display.split(' ').slice(1).join(' ');await cloudClient.from('visitantes').upsert({user_id:ru.id,display_name:display,first_name:first,last_name:last,email:ru.email},{onConflict:'user_id'});let q=await cloudClient.from('progreso_visitantes').select('*').eq('user_id',ru.id).maybeSingle();db.users=db.users.filter(x=>x.email!==ru.email);db.users.push({first,last,phone:meta.phone||'',email:ru.email,stats:{points:q.data?.points||0,visits:q.data?.visited_animals||[],correct:q.data?.correct_answers||0,answered:q.data?.answered_questions||0,completed:q.data?.completed_tours||0}});page='home';render()})}else{render()}
</script></body></html>
