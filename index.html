function ticketFingerprint(value){let h=2166136261;for(let i=0;i<value.length;i++){h^=value.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
async function redeemTicket(raw){let code=String(raw||'').trim();if(!code){flash='El QR no contiene un código de entrada válido.';return render()}scannerBusy=true;stopTicketScanner();scannerBusy=true;try{let st=stats();if(cloudClient&&db.cloudUserId){let r=await cloudClient.rpc('zv_redeem_ticket',{p_qr_code:code});if(r.error)throw r.error;if(!r.data||!r.data.redeemed){flash='Esta entrada ya fue canjeada. Cada ticket suma una sola vez.';return render()}let synced=await syncCloudProgress(st),ticketPoints=Number(r.data.points)||25;if(!synced)st.points=(Number(st.points)||0)+ticketPoints;flash='¡Entrada registrada! Sumaste '+ticketPoints+' puntos.'}else{st.ticketHashes||=[];let hash=ticketFingerprint(code);if(st.ticketHashes.includes(hash)){flash='Esta entrada ya fue canjeada en este dispositivo.';return render()}st.ticketHashes.push(hash);st.points=(Number(st.points)||0)+25;flash='¡Entrada registrada! Sumaste 25 puntos.';save()}render()}catch(error){console.error('No se pudo registrar la entrada:',error);flash='No se pudo validar esta entrada. Revisa tu conexión e inténtalo otra vez.';render()}finally{scannerBusy=false}}
async function scanTicketImage(input){let file=input&&input.files&&input.files[0];if(!file)return;if(!('BarcodeDetector' in window)){flash='Este navegador no puede leer códigos QR desde imágenes. Prueba con Chrome actualizado.';return render()}try{let detector=new BarcodeDetector({formats:['qr_code']}),bitmap=await createImageBitmap(file),codes=await detector.detect(bitmap);bitmap.close();if(!codes.length){flash='No se detectó un QR en la imagen. Prueba con una foto más clara.';return render()}await redeemTicket(codes[0].rawValue)}catch(error){console.error('Error leyendo la imagen:',error);flash='No se pudo leer la imagen del QR.';render()}}async function completeTour(){if(tourSaving)return;tourSaving=true;let st=stats(),before=Number(st.points)||0;try{if(cloudClient&&db.cloudUserId){let r=await Promise.race([cloudClient.rpc("zv_finish_tour"),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);if(r.error)throw r.error;let synced=await syncCloudProgress(st);if(!synced){st.completed=(Number(st.completed)||0)+1;if(st.pointVersion!==1&&!st.tourRewardClaimed){st.points=before+25;st.tourRewardClaimed=true}}}else{st.completed++;if(st.pointVersion!==1&&!st.tourRewardClaimed){st.points=before+25;st.tourRewardClaimed=true}}let gained=Math.max(0,(Number(st.points)||0)-before);flash=gained?"Bono de recorrido: +"+gained+" puntos.":"Recorrido guardado.";save();go("final")}catch(error){console.error("Error finalizando recorrido:",error);flash="No se pudo confirmar el recorrido. Revisa tu conexión e inténtalo otra vez.";render()}finally{tourSaving=false}}function editProfile(e){e.preventDefault();Object.assign(user(),Object.fromEntries(new FormData(e.target)));save();go('profile')}async function sendOpinion(){if(!stars){flash="Elige una calificación de 1 a 5 estrellas.";return render()}if(!cloudClient){flash="No hay conexión con Supabase. La opinión no se puede guardar en línea.";return render()}let comment=(document.getElementById("optext")?.value||opinionDraft||"").trim();if(comment.length>1000){flash="El comentario puede tener hasta 1000 caracteres.";return render()}let button=document.querySelector(".panel .btn");if(button){button.disabled=true;button.textContent="Enviando opinión…"}try{let payload={visitor_id:db.cloudUserId||null,rating:stars,comment:comment||null},result=await cloudClient.from("opiniones").insert(payload);if(result.error)throw result.error;db.opinions.push({email:db.current==='__guest__'?"Invitado":db.current,stars,text:comment,date:new Date().toISOString()});save();stars=0;opinionDraft="";flash="¡Gracias! Tu opinión quedó guardada.";render()}catch(error){console.error("Error guardando opinión:",error);let message=String(error?.message||"").toLowerCase();flash=message.includes("row-level security")||message.includes("permission denied")||message.includes("visitor_id")||error?.code==="42501"?"Supabase aún bloquea las opiniones de invitados. Ejecuta permitir-opiniones-invitados.sql en el SQL Editor.":"No se pudo guardar la opinión. Revisa tu conexión e inténtalo otra vez.";render()}}async function sendReport(){let file=document.getElementById('rphoto').files[0],photo='';if(file)photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});let category=document.getElementById('rtype').value,place=document.getElementById('rplace').value,description=document.getElementById('rdesc').value;if(cloudClient&&db.cloudUserId){let r=await cloudClient.from('reportes').insert({visitor_id:db.cloudUserId,category,animal_location:place,description});if(r.error){flash='No se pudo guardar el reporte en línea.';return render()}}db.reports.push({email:db.current,type:category,place,text:description,photo,date:new Date().toISOString(),status:'Nuevo'});save();flash='Reporte guardado.';render()}async function logout(){if(cloudClient)await cloudClient.auth.signOut();flash='';if(db.current==='__guest__')db.guest=null;db.current=null;db.cloudUserId=null;save();page='login';render()}function deleteAccount(){if(confirm('¿Eliminar la cuenta y sus datos guardados en este dispositivo?')){db.users=db.users.filter(x=>x.email!==db.current);db.current=null;save();page='login';render()}}
if(cloudClient){renderAuth();cloudClient.auth.getSession().then(async({data})=>{const ru=data.session?.user;if(!ru)return;db.current=ru.email;db.cloudUserId=ru.id;const meta=ru.user_metadata||{},display=meta.display_name||meta.full_name||meta.name||ru.email.split('@')[0],first=meta.first||meta.given_name||display.split(' ')[0],last=meta.last||meta.family_name||display.split(' ').slice(1).join(' ');await cloudClient.from('visitantes').upsert({user_id:ru.id,display_name:display,first_name:first,last_name:last,email:ru.email},{onConflict:'user_id'});let schemaCheck=await cloudClient.from('progreso_visitantes').select('tour_reward_claimed').limit(1);pointSystemVersion=schemaCheck.error?1:2;let q=await cloudClient.from('progreso_visitantes').select('*').eq('user_id',ru.id).maybeSingle();db.users=db.users.filter(x=>x.email!==ru.email);db.users.push({first,last,phone:meta.phone||'',email:ru.email,stats:{points:q.data?.points||0,visits:q.data?.visited_animals||[],correct:q.data?.correct_answers||0,answered:q.data?.answered_questions||0,completed:q.data?.completed_tours||0,tourRewardClaimed:q.data?.tour_reward_claimed||false,pointVersion:pointSystemVersion}});page='home';render()})}else{render()}
</script></body></html>
