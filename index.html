if(page==='points'){let level=s.points>=300?{name:'Embajador de la fauna',emoji:'🏆',floor:300,next:null}:s.points>=150?{name:'Guardián de la fauna',emoji:'🛡️',floor:150,next:300}:s.points>=50?{name:'Explorador experto',emoji:'🧭',floor:50,next:150}:{name:'Explorador inicial',emoji:'🌱',floor:0,next:50};let pct=level.next?Math.min(100,Math.round((s.points-level.floor)/(level.next-level.floor)*100)):100;return '<h1>Mis puntos</h1><section class="hero points-hero"><div><p class="tag">TU PROGRESO</p><div class="score">'+s.points+' ★</div><p>Puntos guardados en tu cuenta</p><strong>'+level.emoji+' '+level.name+'</strong>'+(level.next?'<p class="muted">Te faltan '+Math.max(0,level.next-s.points)+' puntos para el siguiente nivel.</p>':'<p class="muted">¡Llegaste al nivel más alto!</p>')+'<div class="level-track"><span style="width:'+pct+'%"></span></div></div><div class="heroart">🏆</div></section><div class="grid"><div class="card"><h3>🐾 Recintos visitados</h3><div class="score">'+s.visits.length+'</div></div><div class="card"><h3>✅ Respuestas correctas</h3><div class="score">'+s.correct+'</div></div><div class="card"><h3>❔ Preguntas respondidas</h3><div class="score">'+s.answered+'</div></div></div><section class="panel"><h2>Cómo ganar puntos</h2><div class="points-rule"><span>🐾</span><div><b>Visita un recinto</b><small>Una vez por animal</small></div><strong>+'+(s.pointVersion===1?1:25)+' pts</strong></div><div class="points-rule"><span>🧠</span><div><b>Responde bien una pregunta</b><small>Cada pregunta suma una vez</small></div><strong>+'+(s.pointVersion===1?1:10)+' pts</strong></div>'+ (s.pointVersion===1?'':'<div class="points-rule"><span>🏁</span><div><b>Completa tu primer recorrido</b><small>Bono único por cuenta</small></div><strong>+25 pts</strong></div>') +'<p class="notice">Puedes repetir las preguntas para aprender, pero no vuelven a sumar puntos. Los puntos se guardan '+(db.current==='__guest__'?'solo durante esta sesión de invitado.':cloudClient?'en Supabase, asociados a tu cuenta.':'en este dispositivo.')+'</p></section>'}if(page==='profile')return `<h1>Mi perfil</h1><section class="panel"><h2>${esc(u.first)} ${esc(u.last)}</h2><p>${esc(u.email)} · ${esc(u.phone)}</p><p class="score">${s.points} ★ <span class="muted" style="font-size:16px">puntos</span></p><div class="row">${btn('Editar perfil',"go('edit')",'light')} ${btn('Términos y privacidad',"go('terms')",'outline')} ${btn('Cerrar sesión',"logout()",'outline')}</div></section><section class="panel"><h3>Tu actividad</h3><p>${s.visits.length} animales · ${s.answered} preguntas · ${s.correct} aciertos</p><p>Visitados: ${s.visits.map(id=>animals.find(a=>a.id===id)?.name).filter(Boolean).join(', ')||'Aún no hay visitas.'}</p></section><div class="grid"><div class="card" onclick="go('opinion')"><h3>💬 Enviar opinión</h3><p>Cuéntanos cómo te fue.</p></div><div class="card" onclick="go('report')"><h3>🚨 Reportar un problema</h3><p>Mapa, ruta, puntos o información.</p></div><div class="card" onclick="go('contact')"><h3>🏛️ Contacto municipal</h3><p>Canales independientes oficiales.</p></div></div>`;

if(page==='contact')return `<h1>Contacto y reclamos</h1><p class="muted">Sección independiente para contactar canales municipales. Verifica números y enlaces antes de publicar.</p><div class="grid"><div class="card"><h3>🐾 Zoológico Municipal</h3><p>(064) 365843</p><a href="tel:+5164365843">Llamar</a></div><div class="card"><h3>🏛️ Municipalidad Provincial de Huancayo</h3><p>(064) 600-408</p><a href="tel:+5164600408">Llamar</a></div><div class="card"><h3>Libro de reclamaciones</h3><p>Consulta los canales oficiales municipales.</p><a href="https://www.munihuancayo.gob.pe/" target="_blank" rel="noreferrer">Ver sitio municipal</a></div></div><section class="panel"><b>Reportes de esta aplicación</b><p>Usa “Reportar un problema” para errores de mapa, información o funcionamiento. No sustituye el canal oficial.</p>${btn('Ir a reportes',"go('report')",'light')}</section>`;
if(page==='terms')return `<h1>Términos y privacidad</h1><section class="panel"><h2>Uso responsable</h2><p>Esta aplicación tiene finalidad educativa, recreativa y de participación. Proporciona datos verdaderos y mantén segura tu cuenta.</p><p>Los puntos se obtienen mediante las actividades y no se transfieren entre cuentas. Respeta las normas del zoológico: no molestes ni alimentes a los animales y evita ponerlos en riesgo.</p><p>Los comentarios y reportes deben ser responsables y respetuosos. Los reportes de la aplicación no reemplazan un reclamo o denuncia oficial.</p><p>Este prototipo almacena los datos localmente en este dispositivo para gestionar el perfil y el progreso. No envía información a un servidor.</p><p>Puedes cerrar sesión o solicitar la eliminación de tu cuenta desde esta versión mediante el botón inferior.</p>${btn('Eliminar mi cuenta',"deleteAccount()",'outline')}</section>`;
return `<h1>Recorrido completado</h1><section class="hero"><div><p class="tag">¡EXPERIENCIA TERMINADA!</p><h1>${s.points} puntos</h1><p>Animales visitados: ${s.visits.length} · Preguntas: ${s.answered} · Correctas: ${s.correct}</p>${btn('Calificar experiencia',"go('opinion')")} ${btn('Volver al inicio',"go('home')",'light')}</div><div class="heroart">🏁</div></section>`}
function selectAnimal(id){selected=animals.find(a=>a.id===id);if(selected){go('route')}else{render()}}function quizQuestions(a){let facts=a.curiosities||[a.fact,a.fact];return [{q:a.q,opts:a.opts,ans:a.ans,fact:a.fact},{q:'¿Qué alimentación corresponde a este animal?',opts:[a.food,'Solo frutas cítricas','Solo piedras'],ans:0,fact:'La alimentación puede variar según la especie exacta y el ejemplar.'},{q:'¿Cuál es su hábitat general?',opts:[a.habitat,'Un arrecife coralino','El hielo polar'],ans:0,fact:'La especie exacta puede ocupar hábitats distintos.'},{q:'¿Qué dato curioso aprendiste?',opts:[facts[1]||a.fact,'Todos los animales viven en el mismo hábitat.','La especie no necesita cuidados.'],ans:0,fact:facts[1]||a.fact},{q:'¿Cómo debemos comportarnos cerca del recinto?',opts:['Observar con calma y seguir las indicaciones.','Golpear el vidrio para llamar su atención.','Dar comida sin autorización.'],ans:0,fact:'Respetar las indicaciones ayuda a cuidar a los animales y a las personas.'}]}let quizWasCorrect=false,quizDuplicate=false;async function syncCloudProgress(st){if(!cloudClient||!db.cloudUserId)return false;try{let schema=await cloudClient.from('progreso_visitantes').select('tour_reward_claimed').limit(1);pointSystemVersion=schema.error?1:2;st.pointVersion=pointSystemVersion;let p=await cloudClient.from('progreso_visitantes').select('*').eq('user_id',db.cloudUserId).maybeSingle();if(p.error)return false;if(p.data){st.points=Number(p.data.points)||0;st.visits=Array.isArray(p.data.visited_animals)?p.data.visited_animals:[];st.correct=Number(p.data.correct_answers)||0;st.answered=Number(p.data.answered_questions)||0;st.completed=Number(p.data.completed_tours)||0;st.tourRewardClaimed=!!p.data.tour_reward_claimed}return true}catch(error){console.error('No se pudo sincronizar el progreso:',error);return false}}async function startQuiz(){
 quizIndex=0;quizCorrect=0;quizPointsEarned=0;quizLastPoints=0;quizChoice=-1;quizAnswered=false;flash="";let a=selected||animals[0];
 quizSet=quizQuestions(a).map(function(q,index){let mix=[0,1,2];for(let i=mix.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[mix[i],mix[j]]=[mix[j],mix[i]]}return Object.assign({},q,{order:index+1,opts:mix.map(i=>q.opts[i]),ans:mix.indexOf(q.ans),optionMap:mix})});cloudQuizReady=false;
 if(!(cloudClient&&db.cloudUserId)){quizLoading=false;go("quiz");return}
 quizLoading=true;go("quiz");
 try{
  let an=await Promise.race([cloudClient.from("animales").select("id").eq("slug",a.id).maybeSingle(),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);
  if(an.error||!an.data)throw new Error("animal");
  let rows=await Promise.race([cloudClient.from("preguntas").select("id,question_order,pregunta,opcion_a,opcion_b,opcion_c,retroalimentacion").eq("animal_id",an.data.id).eq("active",true).order("question_order",{ascending:true}),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);
  if(rows.error)throw new Error("questions");
  let bank=new Map((rows.data||[]).map(function(r){return [Number(r.question_order),r]}));
  quizSet=quizSet.filter(function(q){return bank.has(q.order)}).map(function(q){let r=bank.get(q.order),opts=[r.opcion_a,r.opcion_b,r.opcion_c],correct=0;if(opts.some(function(x){return !x}))return null;let mix=[0,1,2];for(let i=mix.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[mix[i],mix[j]]=[mix[j],mix[i]]}return {q:r.pregunta,opts:mix.map(function(i){return opts[i]}),ans:mix.indexOf(correct),optionMap:mix,order:q.order,questionId:r.id,fact:r.retroalimentacion||""}}).filter(Boolean);
  if(quizSet.length<5)flash="Se cargaron "+quizSet.length+" preguntas disponibles. Ejecuta mejorar-quiz-puntos.sql para habilitar las cinco preguntas.";
  if(!quizSet.length)flash="No hay preguntas activas para este animal. Ejecuta mejorar-quiz-puntos.sql en Supabase.";
  await syncCloudProgress(stats());cloudQuizReady=quizSet.length>0;
 }catch(error){console.error("Error cargando trivia:",error);quizSet=[];cloudQuizReady=false;flash=error.message==="animal"?"Este animal todavía no está en la base de Supabase. Ejecuta actualizar-animales-mapa.sql.":error.message==="questions"?"No se pudieron leer las preguntas. Revisa los permisos en Supabase.":"La conexión tardó demasiado. Revisa internet e intenta abrir la trivia otra vez."}
 finally{quizLoading=false;render()}
}async function answer(i){
 if(quizAnswered||quizLoading)return;
 let a=selected||animals[0],q=(quizSet||quizQuestions(a))[quizIndex],st=stats(),answerKey=a.id+":"+q.order,before=Number(st.points)||0,synced=false;
 quizChoice=i;quizLastPoints=0;quizWasCorrect=i===q.ans;quizDuplicate=false;
 if(cloudClient&&db.cloudUserId){
  if(!cloudQuizReady||!q.questionId){flash="La pregunta no está sincronizada. Vuelve al mapa e intenta cargar la trivia otra vez.";return render()}
  quizLoading=true;flash="Guardando tu respuesta…";render();
  try{
   let result=await Promise.race([cloudClient.rpc("zv_submit_answer",{p_question_id:q.questionId,p_option:String.fromCharCode(65+q.optionMap[i])}),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);
   if(result.error)throw result.error;
   if(!result.data||typeof result.data.is_correct!=="boolean")throw new Error("respuesta inválida");
   quizWasCorrect=result.data.is_correct;quizDuplicate=!!result.data.already_answered;if(result.data.correct_option){let actual=["A","B","C"].indexOf(String(result.data.correct_option).toUpperCase());if(actual>=0)q.ans=q.optionMap.indexOf(actual)}synced=await syncCloudProgress(st);
   quizLastPoints=synced?Math.max(0,(Number(st.points)||0)-before):(quizWasCorrect&&!quizDuplicate?(st.pointVersion===1?1:10):0);

  }catch(error){console.error("Error guardando respuesta:",error);quizChoice=-1;flash="No se pudo confirmar la respuesta con el servidor. Revisa tu conexión e inténtalo de nuevo; no se sumarán puntos hasta confirmarla.";return render()}
  finally{quizLoading=false}
 }else{
  st.answeredIds=st.answeredIds||[];quizDuplicate=st.answeredIds.includes(answerKey);
  if(!quizDuplicate){st.answeredIds.push(answerKey);quizLastPoints=quizWasCorrect?(st.pointVersion===1?1:10):0;st.points=(Number(st.points)||0)+quizLastPoints}
 }

 if(!quizDuplicate){if(!synced){st.answered=(Number(st.answered)||0)+1;if(quizWasCorrect)st.correct=(Number(st.correct)||0)+1}if(quizWasCorrect)quizCorrect++}
 quizPointsEarned+=quizLastPoints;save();render()
}function nextQuestion(){if(quizIndex>=quizSet.length-1){finishQuiz();return}quizIndex++;quizAnswered=false;quizChoice=-1;render()}async function finishQuiz(){let st=stats(),a=selected||animals[0];if(!st.visits.includes(a.id)){let added=true,before=Number(st.points)||0;if(cloudClient&&db.cloudUserId){quizLoading=true;flash="Guardando el recinto visitado…";render();try{let q=await Promise.race([cloudClient.from("animales").select("id").eq("slug",a.id).maybeSingle(),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);if(q.error||!q.data)throw new Error("animal");let v=await Promise.race([cloudClient.rpc("zv_record_visit",{p_animal_id:q.data.id}),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);if(v.error)throw v.error;added=v.data===true;let synced=await syncCloudProgress(st);if(added){let gained=synced?Math.max(0,(Number(st.points)||0)-before):(st.pointVersion===1?1:25);if(!synced)st.points=before+gained;quizPointsEarned+=gained}}catch(error){console.error("Error guardando visita:",error);flash="No se pudo guardar la visita. Revisa tu conexión y vuelve a intentarlo; el progreso no se perderá.";return render()}finally{quizLoading=false}}else if(added){let gained=st.pointVersion===1?1:25;st.points=(Number(st.points)||0)+gained;quizPointsEarned+=gained}st.visits.push(a.id)}save();go("quizresult")}async function completeTour(){if(tourSaving)return;tourSaving=true;let st=stats(),before=Number(st.points)||0;try{if(cloudClient&&db.cloudUserId){let r=await Promise.race([cloudClient.rpc("zv_finish_tour"),new Promise(function(_,reject){setTimeout(function(){reject(new Error("timeout"))},15000)})]);if(r.error)throw r.error;let synced=await syncCloudProgress(st);if(!synced){st.completed=(Number(st.completed)||0)+1;if(st.pointVersion!==1&&!st.tourRewardClaimed){st.points=before+25;st.tourRewardClaimed=true}}}else{st.completed++;if(st.pointVersion!==1&&!st.tourRewardClaimed){st.points=before+25;st.tourRewardClaimed=true}}let gained=Math.max(0,(Number(st.points)||0)-before);flash=gained?"Bono de recorrido: +"+gained+" puntos.":"Recorrido guardado.";save();go("final")}catch(error){console.error("Error finalizando recorrido:",error);flash="No se pudo confirmar el recorrido. Revisa tu conexión e inténtalo otra vez.";render()}finally{tourSaving=false}}function editProfile(e){e.preventDefault();Object.assign(user(),Object.fromEntries(new FormData(e.target)));save();go('profile')}async function sendOpinion(){if(!stars){flash='Elige una calificación de 1 a 5 estrellas.';return render()}let comment=document.getElementById('optext').value;if(cloudClient&&db.cloudUserId){let r=await cloudClient.from('opiniones').insert({visitor_id:db.cloudUserId,rating:stars,comment});if(r.error){flash='No se pudo guardar la opinión en línea.';return render()}}db.opinions.push({email:db.current,stars,text:comment,date:new Date().toISOString()});save();flash='¡Gracias! Tu opinión quedó guardada.';render()}async function sendReport(){let file=document.getElementById('rphoto').files[0],photo='';if(file)photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});let category=document.getElementById('rtype').value,place=document.getElementById('rplace').value,description=document.getElementById('rdesc').value;if(cloudClient&&db.cloudUserId){let r=await cloudClient.from('reportes').insert({visitor_id:db.cloudUserId,category,animal_location:place,description});if(r.error){flash='No se pudo guardar el reporte en línea.';return render()}}db.reports.push({email:db.current,type:category,place,text:description,photo,date:new Date().toISOString(),status:'Nuevo'});save();flash='Reporte guardado.';render()}async function logout(){if(cloudClient)await cloudClient.auth.signOut();if(db.current==='__guest__')db.guest=null;db.current=null;db.cloudUserId=null;save();page='login';render()}function deleteAccount(){if(confirm('¿Eliminar la cuenta y sus datos guardados en este dispositivo?')){db.users=db.users.filter(x=>x.email!==db.current);db.current=null;save();page='login';render()}}
if(cloudClient){renderAuth();cloudClient.auth.getSession().then(async({data})=>{const ru=data.session?.user;if(!ru)return;db.current=ru.email;db.cloudUserId=ru.id;const meta=ru.user_metadata||{},display=meta.display_name||meta.full_name||meta.name||ru.email.split('@')[0],first=meta.first||meta.given_name||display.split(' ')[0],last=meta.last||meta.family_name||display.split(' ').slice(1).join(' ');await cloudClient.from('visitantes').upsert({user_id:ru.id,display_name:display,first_name:first,last_name:last,email:ru.email},{onConflict:'user_id'});let schemaCheck=await cloudClient.from('progreso_visitantes').select('tour_reward_claimed').limit(1);pointSystemVersion=schemaCheck.error?1:2;let q=await cloudClient.from('progreso_visitantes').select('*').eq('user_id',ru.id).maybeSingle();db.users=db.users.filter(x=>x.email!==ru.email);db.users.push({first,last,phone:meta.phone||'',email:ru.email,stats:{points:q.data?.points||0,visits:q.data?.visited_animals||[],correct:q.data?.correct_answers||0,answered:q.data?.answered_questions||0,completed:q.data?.completed_tours||0,tourRewardClaimed:q.data?.tour_reward_claimed||false,pointVersion:pointSystemVersion}});page='home';render()})}else{render()}
